<div id="app"><div class="loading">Cargando sistema...</div></div>
<script type="module">
import { initializeApp } from "firebase/app";
import {
  getFirestore, collection, doc, getDoc, getDocs,
  setDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy
} from "firebase/firestore";

const firebaseConfig = {
  apiKey: "AIzaSyAMKOjybLiBmcuws8r5kMitWAH1hHkGNJM",
  authDomain: "permisos-ietd.firebaseapp.com",
  projectId: "permisos-ietd",
  storageBucket: "permisos-ietd.firebasestorage.app",
  messagingSenderId: "62095654521",
  appId: "1:62095654521:web:792dce625bcb2ee0bd9ea8"
};
const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

const COL_DOCENTES = "docentes";
const COL_PERMISOS = "permisos";
const COL_CONFIG   = "config";
const COL_SYSUSERS = "sysusers";

let state = {
  user: null, sysUsers: [], docentes: [], permisos: [], maxPerDay: 5,
  tab: "pendientes", modalPermiso: null, modalObs: "",
  modalPw: false, modalReset: null,
  form: { fecha:"", motivo:"", archivoNombre:"", archivoData:"" },
  fErr:"", fOk:"",
  pw: { actual:"", nueva:"", confirmar:"" }, pwErr:"", pwOk:"",
  resetPw: { nueva:"", confirmar:"" }, resetErr:"", resetOk:"",
  excelMsg: { type:"", text:"" }, editMax: false, maxTemp: 5,
  filtroMesDocente:"todos", filtroMesRector:"todos",
  filtroDia:"", filtroDocente:"todos", filtroMesDoc:"todos",
  filtroSede:"todos",
  loginErr:""
};
function setState(p) { Object.assign(state, p); render(); }

function fmtDate(s) {
  if (!s) return "";
  return new Date(s+"T00:00:00").toLocaleDateString("es-CO",{day:"2-digit",month:"short",year:"numeric"});
}
function getMonthKey(f) { const d=new Date(f); return `${d.getFullYear()}-${d.getMonth()}`; }
function getMonthLabel(k) {
  if (!k) return "";
  const [y,m]=k.split("-");
  return new Date(Number(y),Number(m),1).toLocaleDateString("es-CO",{month:"long",year:"numeric"});
}
function uniqueMonths(list) {
  return [...new Set(list.map(p=>getMonthKey(p.fecha)))].sort((a,b)=>b.localeCompare(a));
}
function badge(estado) {
  const map={pendiente:"Pendiente",aprobado:"Aprobado",rechazado:"Rechazado",cancelado:"Cancelado"};
  const bgMap={pendiente:"var(--yellow-bg)",aprobado:"var(--green-bg)",rechazado:"var(--red-bg)",cancelado:"#F1F5F9"};
  const colMap={pendiente:"var(--yellow)",aprobado:"var(--green)",rechazado:"var(--red)",cancelado:"#475569"};
  return `<span class="badge" style="background:${bgMap[estado]||bgMap.pendiente};color:${colMap[estado]||colMap.pendiente}">${map[estado]||estado}</span>`;
}
function rolLabel(r){return{admin:"Administrador",rector:"Rector",docente:"Docente"}[r]||r;}

// ── FIREBASE ──
async function loadSysUsers() {
  const snap = await getDocs(collection(db, COL_SYSUSERS));
  if (snap.empty) {
    const defaults = [
      {id:"admin", nombre:"Administrador",   rol:"admin",  password:"admin123",  documento:"admin",  sede:""},
      {id:"rector",nombre:"Rector Principal",rol:"rector", password:"rector123", documento:"rector", sede:""}
    ];
    for (const u of defaults) await setDoc(doc(db,COL_SYSUSERS,u.id), u);
    state.sysUsers = defaults;
  } else {
    state.sysUsers = snap.docs.map(d=>d.data());
  }
}
async function loadDocentes() {
  const snap = await getDocs(collection(db,COL_DOCENTES));
  state.docentes = snap.docs.map(d=>d.data());
}
async function loadConfig() {
  try {
    const snap = await getDoc(doc(db,COL_CONFIG,"settings"));
    state.maxPerDay = snap.exists() ? (snap.data().maxPerDay||5) : 5;
    state.maxTemp   = state.maxPerDay;
  } catch(e) { state.maxPerDay=5; state.maxTemp=5; }
}
function listenPermisos() {
  onSnapshot(query(collection(db,COL_PERMISOS),orderBy("ts","desc")), snap=>{
    state.permisos = snap.docs.map(d=>d.data());
    render();
  }, err=>console.error("Firestore error:",err));
}
async function saveDocentes(list) {
  const snap = await getDocs(collection(db,COL_DOCENTES));
  for (const d of snap.docs) await deleteDoc(d.ref);
  for (const d of list) await setDoc(doc(db,COL_DOCENTES,d.id),d);
  state.docentes = list;
}
async function savePermiso(p)      { await setDoc(doc(db,COL_PERMISOS,String(p.id)),p); }
async function updatePermiso(id,p) { await updateDoc(doc(db,COL_PERMISOS,String(id)),p); }
async function saveSysUser(u)      { await setDoc(doc(db,COL_SYSUSERS,u.id),u); }
async function saveConfig(v)       { await setDoc(doc(db,COL_CONFIG,"settings"),{maxPerDay:v}); state.maxPerDay=v; }

// ── EVENTO GLOBAL PARA CANCELAR (delegación) ──
document.addEventListener("click", async function(e) {
  const btn = e.target.closest(".btn-cancelar-permiso");
  if (!btn) return;
  e.stopPropagation();
  await cancelarPermiso(btn.dataset.id);
});
async function init() {
  try {
    await loadSysUsers();
    await loadDocentes();
    await loadConfig();
    listenPermisos();
    render();
  } catch(e) {
    console.error("Init error:",e);
    document.getElementById("app").innerHTML=`<div class="loading">Error al conectar con Firebase. Revisa la consola.</div>`;
  }
}
init();

// ── AUTH ──
function login() {
  const documento = document.getElementById("inp-doc").value.trim();
  const password  = document.getElementById("inp-pass").value;
  const u = [...state.sysUsers,...state.docentes].find(u=>u.documento===documento && u.password===password);
  if (!u) { setState({loginErr:"Documento o contraseña incorrectos."}); return; }
  setState({user:u, loginErr:""});
}
function logout() { setState({user:null, tab:"pendientes", modalPw:false, form:{fecha:"",motivo:"",archivoNombre:"",archivoData:""}}); }

// ── CONTRASEÑAS ──
async function cambiarPw() {
  const {pw,user} = state;
  if (user.password!==pw.actual) { setState({pwErr:"La contraseña actual no es correcta.",pwOk:""}); return; }
  if (pw.nueva.length<4)         { setState({pwErr:"Mínimo 4 caracteres.",pwOk:""}); return; }
  if (pw.nueva!==pw.confirmar)   { setState({pwErr:"Las contraseñas no coinciden.",pwOk:""}); return; }
  const updated={...user,password:pw.nueva};
  if (user.rol==="docente") { await setDoc(doc(db,COL_DOCENTES,user.id),updated); state.docentes=state.docentes.map(d=>d.id===user.id?updated:d); }
  else { await saveSysUser(updated); state.sysUsers=state.sysUsers.map(s=>s.id===user.id?updated:s); }
  setState({user:updated, pw:{actual:"",nueva:"",confirmar:""}, pwErr:"", pwOk:"Contraseña actualizada."});
}
async function resetearPw() {
  const {resetPw,modalReset} = state;
  if (resetPw.nueva.length<4)       { setState({resetErr:"Mínimo 4 caracteres.",resetOk:""}); return; }
  if (resetPw.nueva!==resetPw.confirmar) { setState({resetErr:"Las contraseñas no coinciden.",resetOk:""}); return; }
  const target=[...state.sysUsers,...state.docentes].find(u=>u.id===modalReset);
  if (!target) return;
  const updated={...target,password:resetPw.nueva};
  if (target.rol==="docente") { await setDoc(doc(db,COL_DOCENTES,target.id),updated); state.docentes=state.docentes.map(d=>d.id===target.id?updated:d); }
  else { await saveSysUser(updated); state.sysUsers=state.sysUsers.map(s=>s.id===target.id?updated:s); }
  setState({resetPw:{nueva:"",confirmar:""}, resetErr:"", resetOk:`Contraseña de ${target.nombre} actualizada.`});
}

// ── EXCEL ──
function handleExcel(e) {
  const file=e.target.files[0]; if (!file) return;
  const reader=new FileReader();
  reader.onload=async ev=>{
    try {
      const wb=XLSX.read(new Uint8Array(ev.target.result),{type:"array"});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{defval:""});
      const nuevos=rows.map(row=>{
        const documento=String(row["DOCUMENTO"]||row["documento"]||"").trim();
        const nombre   =String(row["NOMBRES"]  ||row["nombres"]  ||"").trim();
        const sede     =String(row["SEDE"]     ||row["sede"]     ||"").trim();
        if (!documento||!nombre) return null;
        const existing=state.docentes.find(d=>d.documento===documento);
        return {id:`doc_${documento}`,documento,nombre,sede,rol:"docente",password:existing?existing.password:documento};
      }).filter(Boolean);
      if (nuevos.length===0) { setState({excelMsg:{type:"err",text:"No se encontraron filas válidas."}}); return; }
      await saveDocentes(nuevos);
      setState({excelMsg:{type:"ok",text:`✓ ${nuevos.length} docente(s) cargado(s).`}});
    } catch(err) { setState({excelMsg:{type:"err",text:"Error al leer el archivo."}}); }
  };
  reader.readAsArrayBuffer(file);
  e.target.value="";
}

// ── SOLICITAR ──
async function solicitar() {
  const {form,user,permisos} = state;
  setState({fErr:"",fOk:""});
  if (!form.fecha||!form.motivo.trim()) { setState({fErr:"Completa fecha y motivo."}); return; }
  if (!form.archivoData)               { setState({fErr:"El documento adjunto en PDF es obligatorio."}); return; }
  const mesKey=getMonthKey(form.fecha);
  const enMes=permisos.filter(p=>p.docenteId===user.id&&getMonthKey(p.fecha)===mesKey&&p.estado!=="rechazado"&&p.estado!=="cancelado");
  if (enMes.length>=3) { setState({fErr:"Ya tienes 3 permisos este mes."}); return; }
  const enDia=permisos.filter(p=>p.fecha===form.fecha&&p.estado!=="rechazado"&&p.estado!=="cancelado");
  if (enDia.length>=3) { setState({fErr:"Ya hay 3 docentes con permiso ese día."}); return; }
  try {
    const id=Date.now();
    await savePermiso({id,docenteId:user.id,docenteNombre:user.nombre,sede:user.sede||"",
      fecha:form.fecha,motivo:form.motivo,archivoNombre:form.archivoNombre,
      archivoData:form.archivoData,estado:"pendiente",observacion:"",ts:new Date().toISOString()});
    setState({form:{fecha:"",motivo:"",archivoNombre:"",archivoData:""},fOk:"Solicitud enviada correctamente."});
  } catch(err) {
    setState({fErr:"Error al guardar. El archivo puede ser muy grande, comprime el PDF en ilovepdf.com"});
  }
}

// ── CANCELAR PERMISO (DOCENTE) ──
async function cancelarPermiso(id) {
  const p = state.permisos.find(x => String(x.id) === String(id));
  if (!p) { alert("No se encontró el permiso."); return; }
  const hoy = new Date();
  const hoyStr = `${hoy.getFullYear()}-${String(hoy.getMonth()+1).padStart(2,"0")}-${String(hoy.getDate()).padStart(2,"0")}`;
  if (p.fecha <= hoyStr) { alert("No puedes cancelar este permiso. Solo puedes cancelar hasta el día anterior."); return; }
  if (!confirm(`¿Cancelar el permiso del ${fmtDate(p.fecha)}?`)) return;
  try {
    await updateDoc(doc(db, COL_PERMISOS, String(p.id)), { estado:"cancelado" });
  } catch(e) { alert("Error al cancelar. Intenta de nuevo."); console.error(e); }
}

// ── DECIDIR ──
async function decidir(id,estado) {
  const {permisos,modalObs,maxPerDay}=state;
  if (estado==="aprobado") {
    const p=permisos.find(x=>x.id===id);
    const sede=p?.sede||"";
    const aprobadosDia=permisos.filter(x=>x.fecha===p.fecha&&x.estado==="aprobado"&&(x.sede||"")===sede).length;
    if (aprobadosDia>=maxPerDay) { alert(`Límite de ${maxPerDay} permisos por día para la sede "${sede||"sin sede"}" ya fue alcanzado.`); return; }
  }
  await updatePermiso(id,{estado,observacion:modalObs});
  setState({modalPermiso:null,modalObs:""});
}

// ── DATOS DERIVADOS ──
function derived() {
  const {user,permisos}=state;
  const misPermisos=permisos.filter(p=>p.docenteId===user?.id);
  const pendientes =permisos.filter(p=>p.estado==="pendiente").sort((a,b)=>a.ts.localeCompare(b.ts));
  const historialR =permisos.filter(p=>p.estado!=="pendiente");
  const usadosMes  =user?permisos.filter(p=>p.docenteId===user.id&&getMonthKey(p.fecha)===getMonthKey(new Date().toISOString())&&p.estado!=="rechazado"&&p.estado!=="cancelado").length:0;
  return {misPermisos,pendientes,historialR,usadosMes};
}

// ── TOPBAR ──
function topbarHtml(){
  const {user}=state;
  return`<div class="topbar">
    <div class="topbar-left">
      <div class="topbar-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round"/></svg>
      </div>
      <div><p style="font-size:13px;font-weight:500">IETD San José de Sitionuevo</p>
           <p style="font-size:11px;color:var(--sub)">Permisos Docentes</p></div>
    </div>
    <div class="topbar-right">

// ── RECTOR ──
function renderRector(){
  const {tab,permisos,maxPerDay,modalPermiso,modalObs,modalPw,filtroMesRector,filtroDia,filtroDocente,filtroMesDoc,filtroSede}=state;
  const {pendientes,historialR}=derived();

  // Sedes disponibles
  const sedesDisp=["todos",...new Set(permisos.map(p=>p.sede||"Sin sede").filter(Boolean))].filter((v,i,a)=>a.indexOf(v)===i);

  // Pendientes filtrados por sede
  const pendientesFiltrados=filtroSede==="todos"?pendientes:pendientes.filter(p=>(p.sede||"Sin sede")===filtroSede);

  const mesesR=uniqueMonths(historialR);
  const histF=filtroMesRector==="todos"?historialR:historialR.filter(p=>getMonthKey(p.fecha)===filtroMesRector);
  const todosP=permisos.filter(p=>p.docenteNombre);
  const docNames=[...new Set(todosP.map(p=>p.docenteNombre))].sort();
  const mesesDocAll=uniqueMonths(todosP);
  const filtradosDoc=todosP.filter(p=>(filtroDocente==="todos"||p.docenteNombre===filtroDocente)&&(filtroMesDoc==="todos"||getMonthKey(p.fecha)===filtroMesDoc));
  const resumen={};
  filtradosDoc.forEach(p=>{
    const mes=getMonthKey(p.fecha);
    const key=`${p.docenteNombre}||${mes}`;
    if(!resumen[key]) resumen[key]={nombre:p.docenteNombre,sede:p.sede||"—",mes,total:0,aprobados:0,rechazados:0,pend:0,cancelados:0};
    resumen[key].total++;
    if(p.estado==="aprobado") resumen[key].aprobados++;
    else if(p.estado==="rechazado") resumen[key].rechazados++;
    else if(p.estado==="cancelado") resumen[key].cancelados++;
    else resumen[key].pend++;
  });
  const rowsDoc=Object.values(resumen).sort((a,b)=>b.mes.localeCompare(a.mes)||a.nombre.localeCompare(b.nombre));
  const baseD=filtroDia?permisos.filter(p=>p.estado==="aprobado"&&p.fecha===filtroDia):permisos.filter(p=>p.estado==="aprobado");
  const mapaD={};
  baseD.forEach(p=>{const key=`${p.fecha}||${p.sede||"Sin sede"}`;if(!mapaD[key])mapaD[key]={fecha:p.fecha,sede:p.sede||"Sin sede",count:0};mapaD[key].count++;});
  const diasAp=Object.values(mapaD).sort((a,b)=>b.fecha.localeCompare(a.fecha));

  let modalHtml="";
  if(modalPermiso){
    const p=modalPermiso;
    const sede=p.sede||"";
    const aprobadosDia=permisos.filter(x=>x.fecha===p.fecha&&x.estado==="aprobado"&&(x.sede||"")===sede).length;
    const restantes=maxPerDay-aprobadosDia;
    modalHtml=`<div class="overlay"><div class="modal"><h3>Revisar solicitud</h3>
      <div class="modal-info">
        <p><b>${p.docenteNombre}</b></p>
        ${p.sede?`<p style="color:var(--sub)">Sede: ${p.sede}</p>`:""}
        <p style="color:var(--sub)">Fecha: ${fmtDate(p.fecha)}</p>
        <p style="color:var(--sub)">Motivo: ${p.motivo}</p>
        ${p.archivoData?`<a href="${p.archivoData}" download="${p.archivoNombre}" style="font-size:12px">📎 Descargar PDF</a>`:""}
        <p style="font-size:12px;margin-top:6px;color:${restantes<=0?"var(--red)":"var(--green)"};font-weight:500">
          ${restantes<=0?`⚠️ Límite de sede alcanzado (${maxPerDay}/${maxPerDay})`:`Cupos disponibles en sede: ${restantes}`}
        </p>
      </div>
      <div class="field"><label class="lbl">Observación (opcional)</label>
        <textarea id="modal-obs" class="inp" rows="3" placeholder="Escribe una observación...">${modalObs}</textarea></div>
      <div class="modal-btns">
        <button class="btn btn-success" style="flex:1" id="btn-aprobar">Aprobar</button>
        <button class="btn btn-danger"  style="flex:1" id="btn-rechazar">Rechazar</button>
        <button class="btn btn-ghost"   id="btn-cancelar">Cancelar</button>
      </div></div></div>`;}

  return`${topbarHtml()}
  <div class="page">
    <div class="stat-grid">
      ${[["Pendientes",pendientes.length],["Aprobados",permisos.filter(p=>p.estado==="aprobado").length],["Rechazados",permisos.filter(p=>p.estado==="rechazado").length]]
        .map(([l,v])=>`<div class="stat"><p class="stat-label">${l}</p><p class="stat-val">${v}</p></div>`).join("")}
    </div>
    <div class="tabs">
      ${[["pendientes",`Pendientes (${pendientes.length})`],["historial","Historial"],["por-dia","Por día"],["por-docente","Por docente"]]
        .map(([t,l])=>`<button class="tab ${tab===t?"active":""}" data-tab="${t}">${l}</button>`).join("")}
    </div>

    ${tab==="pendientes"?`
      <div class="filtros">
        <span style="font-size:13px;color:var(--sub)">Sede:</span>
        <select id="fil-sede" class="inp-sm">
          <option value="todos">Todas las sedes</option>
          ${sedesDisp.filter(s=>s!=="todos").map(s=>`<option value="${s}" ${filtroSede===s?"selected":""}>${s}</option>`).join("")}
        </select>
        <span style="font-size:12px;color:var(--sub)">${pendientesFiltrados.length} solicitud(es)</span>
      </div>
      ${pendientesFiltrados.length===0?`<p style="font-size:13px;color:var(--sub)">No hay solicitudes pendientes.</p>`:""}
      ${pendientesFiltrados.map(p=>`<div class="perm-row">
        <div>
          <p style="font-weight:500">${p.docenteNombre}</p>
          <p style="font-size:12px;color:var(--sub)">${p.sede?p.sede+" · ":""}${fmtDate(p.fecha)} · ${p.motivo}</p>
          ${p.archivoData?`<a href="${p.archivoData}" download="${p.archivoNombre}" style="font-size:11px">Ver PDF</a>`:""}
        </div>
        <button class="btn btn-primary btn-sm btn-revisar" data-id="${p.id}">Revisar</button>
      </div>`).join("")}`:""}

    ${tab==="historial"?`
      <div class="filtros">
        <span style="font-size:13px;color:var(--sub)">Mes:</span>
        <select id="fil-mes-rector" class="inp-sm">
          <option value="todos">Todos los meses</option>
          ${mesesR.map(k=>`<option value="${k}" ${filtroMesRector===k?"selected":""}>${getMonthLabel(k)}</option>`).join("")}
        </select>
        <span style="font-size:12px;color:var(--sub)">${histF.length} registro(s)</span>
      </div>
      ${histF.length===0?`<p style="font-size:13px;color:var(--sub)">Sin registros.</p>`:""}
      ${histF.map(p=>`<div class="perm-row">
        <div>
          <p style="font-weight:500">${p.docenteNombre}</p>
          <p style="font-size:12px;color:var(--sub)">${p.sede?p.sede+" · ":""}${fmtDate(p.fecha)} · ${p.motivo}</p>
          ${p.observacion?`<p style="font-size:11px;color:var(--sub)">Obs: ${p.observacion}</p>`:""}
          ${p.archivoData?`<a href="${p.archivoData}" download="${p.archivoNombre}" style="font-size:11px">Ver PDF</a>`:""}
        </div>${badge(p.estado)}
      </div>`).join("")}`:""}

    ${tab==="por-dia"?`
      <div class="filtros">
        <span style="font-size:13px;color:var(--sub)">Fecha:</span>
        <input type="date" id="fil-dia" class="inp-sm" value="${filtroDia}"/>
        ${filtroDia?`<button class="btn btn-ghost btn-sm" id="btn-clear-dia">Limpiar</button>`:""}
      </div>
      <div class="card" style="padding:0;overflow:hidden">
        <div style="padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">
          <p style="font-size:13px;font-weight:500">Aprobados por día y sede</p>
          <span class="badge" style="background:var(--blue-light);color:var(--blue)">Límite: ${maxPerDay}/día/sede</span>
        </div>
        ${diasAp.length===0?`<p style="font-size:13px;color:var(--sub);padding:16px">Sin registros.</p>`:`
        <table><thead><tr><th>Fecha</th><th>Sede</th><th>Aprobados</th><th>Estado</th></tr></thead><tbody>
          ${diasAp.map(r=>{
            const pct=r.count/maxPerDay;
            const col=pct>=1?"var(--red)":pct>=0.8?"var(--yellow)":"var(--green)";
            const bgc=pct>=1?"var(--red-bg)":pct>=0.8?"var(--yellow-bg)":"var(--green-bg)";
            return`<tr>
              <td>${fmtDate(r.fecha)}</td><td style="color:var(--sub)">${r.sede}</td>
              <td><div style="display:flex;align-items:center;gap:8px">
                <div class="prog-wrap"><div class="prog-bar" style="width:${Math.min(pct*100,100)}%;background:${col}"></div></div>
                <span style="font-weight:500">${r.count}/${maxPerDay}</span>
              </div></td>
              <td><span class="badge" style="background:${bgc};color:${col}">${pct>=1?"Límite alcanzado":pct>=0.8?"Casi lleno":"Disponible"}</span></td>
            </tr>`;}).join("")}
        </tbody></table>`}
      </div>`:""}

    ${tab==="por-docente"?`
      <div class="filtros">
        <span style="font-size:13px;color:var(--sub)">Docente:</span>
        <select id="fil-docente" class="inp-sm">
          <option value="todos">Todos</option>
          ${docNames.map(n=>`<option value="${n}" ${filtroDocente===n?"selected":""}>${n}</option>`).join("")}
        </select>
        <span style="font-size:13px;color:var(--sub)">Mes:</span>
        <select id="fil-mes-doc" class="inp-sm">
          <option value="todos">Todos</option>
          ${mesesDocAll.map(k=>`<option value="${k}" ${filtroMesDoc===k?"selected":""}>${getMonthLabel(k)}</option>`).join("")}
        </select>
        <span style="font-size:12px;color:var(--sub)">${rowsDoc.length} registro(s)</span>
      </div>
      <div class="card" style="padding:0;overflow:hidden">
        ${rowsDoc.length===0?`<p style="font-size:13px;color:var(--sub);padding:16px">Sin registros.</p>`:`
        <table><thead><tr><th>Docente</th><th>Sede</th><th>Mes</th><th>Total</th><th>Aprobados</th><th>Rechazados</th><th>Cancelados</th><th>Pendientes</th></tr></thead><tbody>
          ${rowsDoc.map(r=>`<tr>
            <td style="font-weight:500">${r.nombre}</td>
            <td style="color:var(--sub)">${r.sede}</td>
            <td style="color:var(--sub);text-transform:capitalize">${getMonthLabel(r.mes)}</td>
            <td><span style="font-weight:600;color:var(--blue)">${r.total}</span></td>
            <td><span style="color:var(--green);font-weight:500">${r.aprobados}</span></td>
            <td><span style="color:var(--red);font-weight:500">${r.rechazados}</span></td>
            <td><span style="color:#475569;font-weight:500">${r.cancelados}</span></td>
            <td><span style="color:var(--yellow);font-weight:500">${r.pend}</span></td>
          </tr>`).join("")}
        </tbody></table>`}
      </div>`:""}
  </div>
  ${modalHtml}${modalPwHtml()}`;}

function renderDocente(){
  const {form,fErr,fOk,modalPw,filtroMesDocente}=state;
  const {misPermisos,usadosMes}=derived();
  const mesesD=uniqueMonths(misPermisos);
  const histF=filtroMesDocente==="todos"?misPermisos:misPermisos.filter(p=>getMonthKey(p.fecha)===filtroMesDocente);
  return`${topbarHtml()}
  <div class="page">
    <div class="stat-grid">
      ${[["Usados este mes",`${usadosMes}/3`],["Total enviados",misPermisos.length],["Aprobados",misPermisos.filter(p=>p.estado==="aprobado").length]]
        .map(([l,v])=>`<div class="stat"><p class="stat-label">${l}</p><p class="stat-val">${v}</p></div>`).join("")}
    </div>
    <div class="card">
      <p style="font-size:14px;font-weight:500;margin-bottom:16px">Nueva solicitud de permiso</p>
      <div class="grid2">
        <div class="field"><label class="lbl">Fecha</label>
          <input type="date" id="f-fecha" class="inp" value="${form.fecha}"/></div>
        <div class="field"><label class="lbl">Adjunto PDF <span class="required">*</span></label>
          <input type="file" id="f-archivo" accept=".pdf"/>
          ${!form.archivoData?`<p style="font-size:11px;color:var(--red);margin-top:3px">Requerido (máx. 800KB)</p>`:""}
          ${form.archivoNombre?`<p style="font-size:11px;color:var(--green);margin-top:3px">✓ ${form.archivoNombre}</p>`:""}
        </div>
      </div>
      <div class="field"><label class="lbl">Motivo</label>
        <textarea id="f-motivo" class="inp" rows="3" placeholder="Describe el motivo...">${form.motivo}</textarea></div>
      ${fErr?`<p class="msg-err">${fErr}</p>`:""}
      ${fOk?`<p class="msg-ok">${fOk}</p>`:""}
      <button class="btn btn-primary" id="btn-solicitar">Enviar solicitud</button>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <p style="font-size:14px;font-weight:500">Mis permisos</p>
      <select id="fil-mes-doc" class="inp-sm">
        <option value="todos">Todos los meses</option>
        ${mesesD.map(k=>`<option value="${k}" ${filtroMesDocente===k?"selected":""}>${getMonthLabel(k)}</option>`).join("")}
      </select>
    </div>
    ${histF.length===0?`<p style="font-size:13px;color:var(--sub)">No hay permisos para mostrar.</p>`:""}
    ${histF.map(p=>{
      const hoy=new Date();
      const hoyStr=`${hoy.getFullYear()}-${String(hoy.getMonth()+1).padStart(2,"0")}-${String(hoy.getDate()).padStart(2,"0")}`;
      const puedeCancelar=(p.estado==="pendiente"||p.estado==="aprobado")&&p.fecha>hoyStr;
      return`<div class="perm-row">
        <div>
          <p style="font-weight:500">${fmtDate(p.fecha)}</p>
          <p style="font-size:12px;color:var(--sub)">${p.motivo}</p>
          ${p.archivoData?`<a href="${p.archivoData}" download="${p.archivoNombre}" style="font-size:11px">Descargar PDF</a>`:""}
          ${p.observacion?`<p style="font-size:11px;color:var(--sub)">Obs: ${p.observacion}</p>`:""}
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
          ${badge(p.estado)}
          ${puedeCancelar?`<button class="btn btn-danger btn-sm btn-cancelar-permiso" data-id="${p.id}" style="font-size:11px;padding:4px 10px">✕ Cancelar</button>`:""}
        </div>
      </div>`;}).join("")}
  </div>
  ${modalPwHtml()}`;}

function bindDocente(){
  bindTopbar(); bindModalPw();
  document.getElementById("f-fecha").oninput=e=>{state.form.fecha=e.target.value;};
  document.getElementById("f-motivo").oninput=e=>{state.form.motivo=e.target.value;};
  document.getElementById("f-archivo").onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    if(f.type!=="application/pdf"){setState({fErr:"Solo se permiten archivos PDF.",fOk:""});e.target.value="";return;}
    if(f.size>800*1024){
      setState({fErr:`El archivo pesa ${(f.size/1024).toFixed(0)}KB. Máximo 800KB. Comprime en ilovepdf.com`,fOk:""});
      e.target.value="";
      state.form.archivoNombre="";
      state.form.archivoData="";
      render();
      return;
    }
    const r=new FileReader();
    r.onload=ev=>{state.form.archivoNombre=f.name;state.form.archivoData=ev.target.result;state.fErr="";render();};
    r.readAsDataURL(f);
  };
  document.getElementById("btn-solicitar").onclick=solicitar;
  const fmd=document.getElementById("fil-mes-doc");
  if(fmd) fmd.onchange=e=>setState({filtroMesDocente:e.target.value});
}

// ── RENDER PRINCIPAL ──
function render(){
  const {user}=state;
  const root=document.getElementById("app");
  if(!user){root.innerHTML=renderLogin();bindLogin();return;}
  if(user.rol==="admin") {root.innerHTML=renderAdmin(); bindAdmin(); }
  if(user.rol==="rector"){root.innerHTML=renderRector();bindRector();}
  if(user.rol==="docente"){root.innerHTML=renderDocente();bindDocente();}
}
</script>
</body>
</html>
